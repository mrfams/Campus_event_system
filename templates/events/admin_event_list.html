{% extends 'base.html' %}
{% block content %}
<h1 class="text-3xl font-bold mb-6">Admin Event Management</h1>
<div class="space-y-4">
    {% for event in events %}
    <div class="bg-white p-4 rounded shadow flex justify-between items-center">
        <div>
            <span class="font-semibold">{{ event.title }}</span>
            <span class="text-gray-600">by {{ event.club.name }}</span>
        </div>
        <div class="space-x-2">
            <a href="{% url 'admin-event-edit' pk=event.pk %}" class="text-blue-600 underline">Edit</a>
            <a href="{% url 'admin-event-delete' pk=event.pk %}" class="text-red-600 underline">Delete</a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}

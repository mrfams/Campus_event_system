{% extends 'base.html' %}
{% block content %}
<div class="bg-white p-6 rounded-xl shadow-md max-w-2xl mx-auto">
    <h2 class="text-xl font-bold mb-4">Add Comment</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Post Comment</button>
        <a href="{% url 'event-detail' pk=event.pk %}" class="ml-2 text-gray-600">Cancel</a>
    </form>
</div>
{% endblock %}

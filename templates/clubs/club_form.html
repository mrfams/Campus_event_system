{% extends 'base.html' %}
{% block content %}
<div class="bg-white p-6 rounded-xl shadow-md max-w-lg mx-auto">
    <h1 class="text-2xl font-bold mb-4 text-gray-800">Create New Club</h1>
    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
            {{ form.name }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            {{ form.description }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Logo</label>
            {{ form.logo }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
            {{ form.category }}
        </div>
        <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">Submit for Approval</button>
    </form>
</div>
{% endblock %}
